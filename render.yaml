databases:
  - name: complaints-db
    plan: free

services:
  - type: web
    name: complaint-backend
    runtime: python
    rootDir: complaint-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: complaints-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: complaint-frontend
    runtime: static
    rootDir: complaint-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false